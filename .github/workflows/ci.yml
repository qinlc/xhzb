name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支的新推送会取消上一次未完成的构建，避免排队。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 测试类依赖真实 PostgreSQL / Redis / 百炼 Key，默认构建先跳过（见 issue #4）。
      - name: Build with Maven
        run: mvn -B clean install -DskipTests

  frontend:
    name: Frontend (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xhzb_ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 当前 package-lock.json 与 pnpm-lock.yaml 并存，锁文件不可信，
      # 因此暂用 npm install；统一包管理器后切换为 npm ci（见 issue #3）。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build:prod
